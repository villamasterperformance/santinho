<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dce6f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>

  <!-- shoulders / suit -->
  <path d="M55 560 C55 425 128 375 200 375 C272 375 345 425 345 560 Z" fill="#0a2963"/>
  <!-- shirt collar -->
  <path d="M168 396 L200 432 L232 396 L220 452 L180 452 Z" fill="#ffffff"/>
  <!-- tie -->
  <path d="M197 432 L203 432 L214 452 L200 560 L186 452 Z" fill="#c23b3b"/>

  <!-- neck -->
  <rect x="178" y="322" width="44" height="58" rx="18" fill="#e9bd9a"/>

  <!-- ears -->
  <circle cx="101" cy="262" r="15" fill="#e9bd9a"/>
  <circle cx="299" cy="262" r="15" fill="#e9bd9a"/>

  <!-- head -->
  <circle cx="200" cy="250" r="98" fill="#eec19f"/>

  <!-- hair -->
  <path d="M104 232
           C100 150 128 108 200 108
           C272 108 300 150 296 232
           C284 200 268 150 200 150
           C132 150 116 200 104 232 Z" fill="#5b6472"/>

  <!-- eyebrows -->
  <rect x="146" y="230" width="36" height="8" rx="4" fill="#4b5563"/>
  <rect x="218" y="230" width="36" height="8" rx="4" fill="#4b5563"/>

  <!-- eyes -->
  <circle cx="164" cy="252" r="8" fill="#233246"/>
  <circle cx="236" cy="252" r="8" fill="#233246"/>

  <!-- nose -->
  <path d="M198 258 Q192 282 200 288 Q208 288 202 258" fill="none" stroke="#c99569" stroke-width="4" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M160 300 Q200 328 240 300" stroke="#8a4a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
