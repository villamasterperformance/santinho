    <!--
      Watchdog anti-tela-branca (ES5 PURO — roda antes do bundle e precisa
      funcionar em Safari antigo; o Vite NÃO rebaixa código inline). Se o app
      não montar em 10s, recupera UMA vez por aba: desregistra o Service Worker
      + limpa caches + recarrega. NÃO toca em localStorage (preserva o login).
      Rede de segurança do incidente 02/07 (bundle ilegível → app não monta).
    -->
    <script>
      (function () {
        window.__BOOT_OK = false
        function montou() {
          var r = document.getElementById('root')
          return window.__BOOT_OK || (r && r.childNodes && r.childNodes.length > 0)
        }
        function recuperar() {
          if (montou()) return
          try {
            if (sessionStorage.getItem('recuperou_branco')) return
            sessionStorage.setItem('recuperou_branco', '1')
          } catch (e) {
            return
          }
          var recarrega = function () {
            window.location.reload()
          }
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (nomes) {
                for (var i = 0; i < nomes.length; i++) caches.delete(nomes[i])
              })
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (var j = 0; j < regs.length; j++) regs[j].unregister()
                setTimeout(recarrega, 300)
              })
            } else {
              setTimeout(recarrega, 300)
            }
          } catch (e2) {
            setTimeout(recarrega, 300)
          }
        }
        setTimeout(recuperar, 10000)
      })()
    </script>
